name: Confirm actual arm targets before locking on fresh throws
on:
  push:
    branches: [experiment/fixed-intercept-speed]
    paths: ['controllers/settled_intercept.py', 'experiments/settled_intercept.py', '.github/workflows/settled-intercept.yml']
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [normal, noisy]
        seed: [951, 952, 953, 954]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scene_setup/requirements.txt
      - run: python -m experiments.settled_intercept --seed ${{ matrix.seed }} --profile ${{ matrix.profile }} --output-dir data
      - uses: actions/upload-artifact@v4
        with:
          name: settled-${{ matrix.seed }}-${{ matrix.profile }}
          path: data
      - run: cat data/trials.csv
