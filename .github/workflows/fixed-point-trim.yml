name: Check higher contact velocity at a fixed joint endpoint
on:
  push:
    branches: [experiment/fixed-intercept-speed]
    paths: ['controllers/fixed_point_trim.py', 'experiments/fixed_point_trim.py', '.github/workflows/fixed-point-trim.yml']
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [normal, noisy]
        seed: [1041, 1042, 1043, 1044, 1045, 1046]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scene_setup/requirements.txt
      - run: python -m unittest experiments.test_intercept_impact experiments.test_segmented_flight experiments.test_lock_timing
      - run: python -m experiments.fixed_point_trim --seed ${{ matrix.seed }} --profile ${{ matrix.profile }} --output-dir data
      - uses: actions/upload-artifact@v4
        with:
          name: trim-${{ matrix.seed }}-${{ matrix.profile }}
          path: data
      - run: cat data/trials.csv
