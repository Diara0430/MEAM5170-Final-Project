name: Cross the selected hand rule with wrist leverage on fresh cuboid throws
on:
  push:
    branches: [experiment/fixed-intercept-speed]
    paths: ['.github/workflows/box-closure-confirmation.yml']
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [normal, noisy, corrected]
        seed: [1131,1132,1133,1134,1135,1136]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scene_setup/requirements.txt
      - run: python -m unittest discover -s experiments -p 'test_*.py'
      - run: python -m experiments.box_closure_confirmation --screen results/box_closure/screen.csv --seed ${{ matrix.seed }} --profile ${{ matrix.profile }} --output-dir data
      - uses: actions/upload-artifact@v4
        with:
          name: trials-${{ strategy.job-index }}
          path: data
      - run: cat data/trials.csv
