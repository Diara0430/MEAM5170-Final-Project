name: Predicted low-level contact on observed long throws
on:
  push:
    branches: [experiment/observed-long-arc]
    paths:
      - 'controllers/contact_preview.py'
      - 'experiments/contact_preview.py'
      - '.github/workflows/contact-preview.yml'
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        seed: [841, 842, 843]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scene_setup/requirements.txt
      - run: python -m unittest experiments.test_ball_observer experiments.test_velocity_selection
      - run: python -m experiments.contact_preview --seed ${{ matrix.seed }} --output-dir data
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.seed }}
          path: data/trials.csv
      - run: cat data/trials.csv
