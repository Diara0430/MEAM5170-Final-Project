name: Confirm local impact previews and 6 mm palm contact choices
on:
  push:
    branches: [experiment/fixed-intercept-speed]
    paths: ['controllers/short_impact.py', 'controllers/impact_spot.py', 'experiments/local_impact.py', '.github/workflows/local-impact.yml']
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [normal, noisy]
        seed: [1031, 1032, 1033, 1034, 1035, 1036]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scene_setup/requirements.txt
      - run: python -m unittest experiments.test_intercept_impact experiments.test_segmented_flight experiments.test_lock_timing
      - run: python -m experiments.local_impact --seed ${{ matrix.seed }} --profile ${{ matrix.profile }} --output-dir data
      - uses: actions/upload-artifact@v4
        with:
          name: local-impact-${{ matrix.seed }}-${{ matrix.profile }}
          path: data
      - run: cat data/trials.csv
