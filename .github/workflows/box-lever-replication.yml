name: Replicate cuboid wrist leverage against its timing control
on:
  push:
    branches: [experiment/fixed-intercept-speed]
    paths: ['.github/workflows/box-lever-replication.yml']
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [normal, noisy, corrected]
        seed: [1111, 1112, 1113, 1114, 1115, 1116]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scene_setup/requirements.txt
      - run: python -m unittest discover -s experiments -p 'test_*.py'
      - run: python -m experiments.shape_catch --seed ${{ matrix.seed }} --profile ${{ matrix.profile }} --methods pose axis_lever axis_lever_shadow --output-dir data
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ strategy.job-index }}
          path: data
      - run: cat data/trials.csv
