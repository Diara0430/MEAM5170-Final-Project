name: Replay first 100 ms and subsequent loss of box support
on:
  push:
    branches: [experiment/fixed-intercept-speed]
    paths: ['.github/workflows/box-contact-window.yml']
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [normal, noisy, corrected]
        seeds: ['1071 1111','1072 1112','1073 1113','1074 1114','1075 1115','1076 1116']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scene_setup/requirements.txt
      - run: python -m unittest discover -s experiments -p 'test_*.py'
      - run: python -m experiments.box_contact_window --seeds ${{ matrix.seeds }} --profile ${{ matrix.profile }} --output-dir data --frames
      - uses: actions/upload-artifact@v4
        with:
          name: trials-${{ strategy.job-index }}
          path: data
      - run: cat data/trials.csv
