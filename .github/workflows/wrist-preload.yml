name: Verify the sign-specific wrist command on independent throws
on:
  push:
    branches: [experiment/fixed-intercept-speed]
    paths: ['controllers/wrist_preload.py', 'experiments/wrist_preload.py', '.github/workflows/wrist-preload.yml']
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [normal, noisy]
        seed: [1091, 1092, 1093, 1094, 1095, 1096]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scene_setup/requirements.txt
      - run: python -m unittest discover -s experiments -p 'test_*.py'
      - run: python -m experiments.wrist_preload --seed ${{ matrix.seed }} --profile ${{ matrix.profile }} --output-dir data
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ strategy.job-index }}
          path: data
      - run: cat data/trials.csv
