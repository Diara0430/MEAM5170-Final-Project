name: Paired MuJoCo catch experiment
on:
  push:
    branches: [experiment/catch-follow-through]
    paths:
      - 'controllers/**'
      - 'experiments/**'
      - '.github/workflows/follow-through-validation.yml'
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scene_setup/requirements.txt
      - run: python -m experiments.follow_through_ablation --output-dir paired --seeds 810 811
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-catch-results
          path: paired/
