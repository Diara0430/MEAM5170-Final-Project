name: Screen long throws with delayed box pose and spin
on:
  push:
    branches: [experiment/fixed-intercept-speed]
    paths: ['.github/workflows/rotating-box-screen.yml', 'experiments/shape_catch.py']
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [normal, noisy]
        seed: [1051, 1052, 1053]
        methods: ['center pose extent', 'single early_lock stop nonlinear', 'trim short spot', 'inertia preview rank prepare']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scene_setup/requirements.txt
      - run: python -m unittest discover -s experiments -p 'test_*.py'
      - run: python -m experiments.shape_catch --seed ${{ matrix.seed }} --profile ${{ matrix.profile }} --methods ${{ matrix.methods }} --output-dir data
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ strategy.job-index }}
          path: data
      - run: cat data/trials.csv
