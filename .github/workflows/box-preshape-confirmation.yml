name: Box middle and ring preshape confirmation
on:
  push:
    branches: [experiment/fixed-intercept-speed]
    paths: ['.github/workflows/box-preshape-confirmation.yml']
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        seed: [1151, 1152, 1153, 1154, 1155, 1156]
        profile: [normal, noisy, corrected]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scene_setup/requirements.txt
      - run: python -m unittest discover -s experiments -p 'test_*.py'
      - run: python -m experiments.box_contact_window --seeds ${{ matrix.seed }} --profile ${{ matrix.profile }} --conditions pose/original pose/middle_ring_curled_shadow pose/middle_ring_curled axis_lever/original axis_lever/middle_ring_curled_shadow axis_lever/middle_ring_curled --output-dir data
      - uses: actions/upload-artifact@v4
        with:
          name: trials-${{ strategy.job-index }}
          path: data
      - run: cat data/trials.csv
