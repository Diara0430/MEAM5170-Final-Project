name: Audit first-contact timing
on:
  push:
    branches: [experiment/fixed-intercept-speed]
    paths: ['experiments/onset_audit.py', '.github/workflows/onset-audit.yml']
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        seed: [861, 862, 863]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scene_setup/requirements.txt
      - run: python -m experiments.onset_audit --seed ${{ matrix.seed }} --output-dir data
      - uses: actions/upload-artifact@v4
        with:
          name: onset-${{ matrix.seed }}
          path: data/
      - run: cat data/audit.csv
      - run: |
          python - <<'PY'
          import csv
          keys = {(862,0),(862,1),(862,5),(863,1),(863,7),(861,5)}
          with open("data/frames.csv") as f:
              rows = csv.DictReader(f)
              print("TRACE=" + ",".join(rows.fieldnames))
              for r in rows:
                  if (int(r["seed"]), int(r["scenario"])) in keys:
                      print("TRACE=" + ",".join(r.values()))
          PY
