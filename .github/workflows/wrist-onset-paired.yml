name: Check wrist-axis changes on archived and new throws
on:
  push:
    branches: [experiment/fixed-intercept-speed]
    paths: ['.github/workflows/wrist-onset-paired.yml', 'experiments/wrist_onset.py', 'controllers/wrist_onset.py']
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [normal, noisy]
        seed: [1041, 1042, 1043, 1044, 1045, 1046, 1061, 1062, 1063, 1064, 1065, 1066]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scene_setup/requirements.txt
      - run: python -m unittest discover -s experiments -p 'test_*.py'
      - run: python -m experiments.wrist_onset --seed ${{ matrix.seed }} --profile ${{ matrix.profile }} --output-dir data
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ strategy.job-index }}
          path: data
      - run: cat data/trials.csv
