name: Verify deadline-limited torque refinement on held-out throws
on:
  push:
    branches: [experiment/observed-long-arc]
    paths:
      - 'controllers/deadline_arm_filter.py'
      - 'experiments/deadline_contact.py'
      - '.github/workflows/refined-contact.yml'
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        seed: [861, 862, 863]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scene_setup/requirements.txt
      - run: python -m unittest experiments.test_ball_observer experiments.test_velocity_selection
      - run: python -m experiments.deadline_contact --refinement --seed ${{ matrix.seed }} --output-dir data
      - uses: actions/upload-artifact@v4
        with:
          name: refinement-${{ matrix.seed }}
          path: data/trials.csv
      - run: cat data/trials.csv
