name: Replay first contact on seven joints
on:
  push:
    branches: [experiment/fixed-intercept-speed]
    paths: ['.github/workflows/contact-joint-replay.yml', 'experiments/contact_joint_replay.py']
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [normal, noisy]
        seed: [1041, 1042, 1043, 1044, 1045, 1046]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scene_setup/requirements.txt
      - run: python -m unittest discover -s experiments -p 'test_*.py'
      - run: python -m experiments.contact_joint_replay --seed ${{ matrix.seed }} --profile ${{ matrix.profile }} --output-dir data
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ strategy.job-index }}
          path: data
      - run: cat data/trials.csv
