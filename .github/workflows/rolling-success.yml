name: Improve rolling catch success on matched long throws
on:
  push:
    branches: [experiment/fixed-intercept-speed]
    paths: ['controllers/segmented_flight.py', 'experiments/rolling_success.py', 'experiments/test_segmented_flight.py', '.github/workflows/rolling-success.yml']
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        seed: [971, 972, 973]
        profile: [normal, noisy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scene_setup/requirements.txt
      - run: python -m unittest experiments.test_segmented_flight experiments.test_lock_timing experiments.test_ball_observer
      - run: python -m experiments.rolling_success --seed ${{ matrix.seed }} --profile ${{ matrix.profile }} --output-dir data
      - uses: actions/upload-artifact@v4
        with:
          name: success-dev-${{ matrix.seed }}-${{ matrix.profile }}
          path: data/trials.csv
      - run: cat data/trials.csv
  validation:
    needs: development
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        seed: [981, 982, 983, 984, 985, 986]
        profile: [normal, noisy, corrected]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: success-dev-*
          path: training
      - run: python -m pip install -r scene_setup/requirements.txt
      - run: python -m experiments.rolling_success --seed ${{ matrix.seed }} --profile ${{ matrix.profile }} --selection training/*/trials.csv --output-dir data
      - uses: actions/upload-artifact@v4
        with:
          name: success-validation-${{ matrix.seed }}-${{ matrix.profile }}
          path: data/trials.csv
      - run: cat data/trials.csv
