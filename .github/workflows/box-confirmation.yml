name: Confirm cuboid catches and wrist transfer on new paired throws
on:
  push:
    branches: [experiment/fixed-intercept-speed]
    paths: ['.github/workflows/box-confirmation.yml', 'results/shape_transfer/box_screen.csv']
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [normal, noisy, corrected]
        seed: [1071, 1072, 1073, 1074, 1075, 1076]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scene_setup/requirements.txt
      - run: python -m unittest discover -s experiments -p 'test_*.py'
      - run: python -m experiments.shape_confirmation --screen results/shape_transfer/box_screen.csv --seed ${{ matrix.seed }} --profile ${{ matrix.profile }} --output-dir data
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ strategy.job-index }}
          path: data
      - run: cat data/trials.csv
